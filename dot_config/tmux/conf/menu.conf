# ─── prefix Space: which-key style menu ──────────────────────────────────────
# Rows: "Label" "key" "command". A label starting with "-" is a dim header.
# Commands that need #{…} formats use the shortcuts from ui.conf: a menu
# expands formats in its commands before running them (see ui.conf).
%hidden SEC="-#[fg=${DIM}]"

bind -N "Keybind menu" Space display-menu -T "${T}Menu " -x C -y C -- \
  "${SEC}── Panes ──"      "" "" \
  "Split right"         "|" "split-right" \
  "Split down"          "-" "split-down" \
  "Zoom toggle"         "z" "resize-pane -Z" \
  "Resize mode"         "r" "switch-client -T resize ; refresh-client -S" \
  "Kill pane"           "x" "kill-pane-prompt" \
  "Swap with next"      ">" "swap-pane -D" \
  "Break to window"     "!" "break-pane" \
  "" \
  "${SEC}── Windows ──"    "" "" \
  "New window"          "c" "new-window-here" \
  "Rename window"       "," "rename-window-prompt" \
  "Kill window"         "&" "kill-window-prompt" \
  "" \
  "${SEC}── Sessions ──"   "" "" \
  "Sessions"            "w" "helper -w 90% -h 90% -T '${T}Sessions ' '$SCRIPTS/jump.sh'" \
  "New session"         "N" "new-session" \
  "Rename session"      "$" "rename-session-prompt" \
  "Detach"              "d" "detach-client" \
  "" \
  "${SEC}── Tools ──"      "" "" \
  "Lazygit"             "g" "tool -T '${T}Lazygit ' lazygit" \
  "Scratch shell"       "t" "tool -T '${T}Shell '" \
  "Command palette"     ":" "helper -T '${T}Command ' '$SCRIPTS/cmd.sh'" \
  "Search keybinds"     "?" "helper -T '${T}Keys ' '$SCRIPTS/keys.sh'" \
  "Copy mode"           "[" "copy-mode" \
  "Reload config"       "R" "source-file ~/.config/tmux/tmux.conf ; display 'config reloaded'" \
  "Browse/edit options" "K" "customize-mode -Z"
