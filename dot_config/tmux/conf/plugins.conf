# ─── Plugins (TPM) ───────────────────────────────────────────────────────────
# prefix I = install, prefix U = update, prefix M-u = remove unlisted
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'   # C-h/j/k/l across vim + panes
set -g @plugin 'tmux-plugins/tmux-resurrect'      # prefix C-s save, C-r restore
set -g @plugin 'tmux-plugins/tmux-continuum'      # autosave + restore on start

set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# keep last
run '~/.config/tmux/plugins/tpm/tpm'
