# Only settings that differ from tmux's defaults live here.

# ─── Prefix: Ctrl+Space ──────────────────────────────────────────────────────
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# ─── General ─────────────────────────────────────────────────────────────────
set -as terminal-features ",*:RGB"   # true color in every terminal
set -g mouse on
set -g focus-events on
set -g history-limit 50000
set -g base-index 1                  # windows and panes count from 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g set-titles on
set -g allow-passthrough on          # images / OSC sequences from apps inside
set -s extended-keys on
set -g display-time 1500             # how long a message stays on row 2
setw -g mode-keys vi
set -g status-keys emacs             # prompt keys: Esc closes it (vi keys need Esc twice)

# ─── Clipboard (Wayland) ─────────────────────────────────────────────────────
set -s set-clipboard on
set -s copy-command "wl-copy"        # used by every copy-pipe-and-cancel
