# ─── Command shortcuts used by keys.conf and menu.conf ───────────────────────
#   helper -T "${T}Name " "$SCRIPTS/x.sh"   fzf helper popup (keys, commands, …)
#   tool   -T "${T}Name " [program]         big popup in the pane's directory
#   split-right / split-down / new-window-here    …in the pane's directory
#   rename-window-prompt / rename-session-prompt  ask for the new name
#   kill-pane-prompt / kill-window-prompt         ask first (same as x and &)
#
# Actions used by both keys and menu are defined here once. Menus also need
# it: they expand #{…} formats in a command (twice) before running it, so
# `#W` written in menu.conf would already be the window name there, and a
# name containing a ' breaks the quoting. Behind a shortcut the format is left
# for the command itself to expand.
#
# Extra arguments are appended to the shortcut. A shortcut that holds several
# commands (helper) must be the LAST command of a binding: tmux drops whatever
# follows it. Rename prompts use %1, not %%: %% breaks text with a ' in it.
#
# helper popup size is set here; its inner look (fzf colors, layout) is in
# scripts/lib/ui.sh. helper first stores the client that opened it in
# @popup_client: a popup can't tell which client it belongs to, and the
# scripts need it (ui_client).
%hidden T="#[align=centre,bold] "
%hidden SCRIPTS="~/.config/tmux/scripts"
set -s command-alias[100] 'helper=set -gF @popup_client "#{client_name}" ; display-popup -E -w 80% -h 75%'
set -s command-alias[101] 'tool=display-popup -E -w 90% -h 90% -d "#{pane_current_path}"'
set -s command-alias[102] 'split-right=split-window -h -c "#{pane_current_path}"'
set -s command-alias[103] 'split-down=split-window -v -c "#{pane_current_path}"'
set -s command-alias[104] 'new-window-here=new-window -c "#{pane_current_path}"'
set -s command-alias[105] 'rename-window-prompt=command-prompt -p "rename window:" -I "#W" { rename-window -- %1 }'
set -s command-alias[106] 'rename-session-prompt=command-prompt -p "rename session:" -I "#S" { rename-session -- %1 }'
set -s command-alias[107] 'kill-pane-prompt=confirm-before -p "kill-pane #P? (y/n)" kill-pane'
set -s command-alias[108] 'kill-window-prompt=confirm-before -p "kill-window #W? (y/n)" kill-window'
