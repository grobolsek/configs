# ─── Colors ──────────────────────────────────────────────────────────────────
# Noctalia renders ~/.config/tmux/colors.conf on every theme change and
# re-sources it. The values below are only fallbacks. Everything else refers to
# the colors through the variables, so it follows the theme live.
set -g @bar "#241a19"
set -g @seg "#423a39"
set -g @seg2 "#302626"
set -g @fg "#e6d6d3"
set -g @dim "#8a7a78"
set -g @dark "#1b1211"
set -g @c_normal "#d6ba86"
set -g @c_prefix "#f2aaa4"
set -g @c_resize "#c9a2c4"
set -g @c_copy "#a3c2a0"
set -g @c_accent "#f2aaa4"
source-file -q ~/.config/tmux/colors.conf

%hidden BAR="#{@bar}"
%hidden SEG="#{@seg}"
%hidden SEG2="#{@seg2}"
%hidden FG="#{@fg}"
%hidden DIM="#{@dim}"
%hidden DARK="#{@dark}"
%hidden C_NORMAL="#{@c_normal}"
%hidden C_PREFIX="#{@c_prefix}"
%hidden C_RESIZE="#{@c_resize}"
%hidden C_COPY="#{@c_copy}"
%hidden C_ACCENT="#{@c_accent}"

%hidden IS_RESIZE="#{==:#{client_key_table},resize}"
%hidden ACTIVE="#{||:#{client_prefix},#{pane_in_mode}}"
%hidden MODE_COLOR="#{?${IS_RESIZE},${C_RESIZE},#{?client_prefix,${C_PREFIX},#{?pane_in_mode,${C_COPY},${C_NORMAL}}}}"
%hidden MODE_NAME="#{?${IS_RESIZE},RESIZE,#{?client_prefix,PREFIX,#{?pane_in_mode,COPY,NORMAL}}}"
%hidden Z="#{?window_zoomed_flag, Z,}"

# ─── Key hints (replace the right-side pills while a mode is active) ─────────
%hidden K="#[fg=${C_ACCENT}]"
%hidden D="#[fg=${DIM}]"
%hidden H_PREFIX=" ${K}|${D} split→  ${K}-${D} split↓  ${K}c${D} window  ${K}x${D} kill  ${K}z${D} zoom  ${K}r${D} resize  ${K}w${D} sessions  ${K}g${D} lazygit  ${K}t${D} shell  ${K}[${D} copy  ${K}R${D} reload  ${K}Space${D} menu  ${K}?${D} keys"
%hidden H_RESIZE=" ${K}hjkl${D} resize  ${K}HJKL${D} ×5  ${K}=${D} equalize  ${K}z${D} zoom  ${K}Esc${D} done"
%hidden H_COPY=" ${K}v${D} select  ${K}C-v${D} block  ${K}y${D} copy  ${K}/${D} search  ${K}q${D} quit"

# ─── Status bar (single line, on top) ────────────────────────────────────────
set -g status-position top
set -g status-interval 5
set -g status-style "bg=${BAR},fg=${FG}"

# Left: mode block ▸ session block
set -g status-left-length 220
set -g status-left "#[fg=${DARK}]#[bg=${MODE_COLOR}]#[bold]  ${MODE_NAME} #[fg=${MODE_COLOR}]#[bg=${SEG}]#[nobold]#[fg=${FG}]  #S #[fg=${SEG}]#[bg=${BAR}] "

# Tabs: current one gets a slanted block, others dim
set -g window-status-separator ""
setw -g window-status-format         "#[fg=${DIM}] #I #W${Z} "
setw -g window-status-current-format "#[fg=${BAR}]#[bg=${SEG2}]#[fg=${FG}]#[bold] #I #W${Z} #[fg=${SEG2}]#[bg=${BAR}]#[nobold]"

# Right: directory (+ git branch) and clock pills, or key hints in a mode
%hidden GIT='#(b=$(git -C #{q:pane_current_path} branch --show-current 2>/dev/null) && [ -n "$b" ] && echo "   $b")'
set -g status-right-length 200
%hidden PILLS="#[fg=${C_ACCENT}]#[bg=${BAR}]#[fg=${DARK}]#[bg=${C_ACCENT}] #[fg=${FG}]#[bg=${SEG2}] #{b:pane_current_path}#[fg=${C_ACCENT}]${GIT} #[fg=${C_ACCENT}]#[bg=${SEG2}]#[fg=${DARK}]#[bg=${C_ACCENT}] #[fg=${FG}]#[bg=${SEG2}] %H:%M "
set -g status-right "#{?${ACTIVE},#{?${IS_RESIZE},${H_RESIZE},#{?client_prefix,${H_PREFIX},${H_COPY}}} ,${PILLS}}"

# ─── Row 2: messages + prompts ───────────────────────────────────────────────
# Row 1 is the menu bar. Row 2 exists only while tmux shows a message or a
# prompt, whatever sent it: a key, the menu, a script, a plugin or tmux itself.
# Two #() jobs drive it (scripts/line2.sh has the details):
#   message-format    drawn for every message and prompt     → `show` adds row 2
#   status-format[1]  drawn only when nothing covers row 2   → `hide` removes it
# For the few ms before row 2 exists, a message is drawn on row 1 as a single
# invisible cell (width 1, no text), so row 1 never shows messages.
%hidden TWO="#{==:#{status},2}"
%hidden LINE2="sh ~/.config/tmux/scripts/line2.sh"
%hidden WHO="'#{socket_path}' '#{session_id}' '#{client_pid}'"
set -g message-line 1
set -g status-format[1] "#(${LINE2} hide ${WHO} '#{@line2_shows}')#[fill=${BAR}]#[bg=${BAR}]"
set -g message-format "#(${LINE2} show ${WHO} '#{@line2_hides}')#{?${TWO},#[fill=${BAR}]#[fg=${C_ACCENT}]#[bold] › #[nobold]#[fg=${FG}]#{message},}"
set -g message-style         "bg=${BAR},fg=${FG},width=#{?${TWO},100%,1},align=#{?${TWO},left,right}"
set -g message-command-style "bg=${BAR},fg=${FG},width=#{?${TWO},100%,1},align=#{?${TWO},left,right}"

# ─── Panes, copy mode ────────────────────────────────────────────────────────
set -g pane-border-style        "fg=${SEG}"
set -g pane-active-border-style "fg=${C_ACCENT}"
setw -g mode-style           "bg=${C_ACCENT},fg=${DARK}"

# ─── Popups + menus (same look everywhere) ───────────────────────────────────
# Selected row = accent background + dark bold text. scripts/lib/ui.sh uses the
# same colors for the fzf helpers.
set -g popup-style         "bg=${BAR},fg=${FG}"
set -g popup-border-style  "fg=${C_ACCENT}"
set -g popup-border-lines  rounded
set -g menu-style          "bg=${BAR},fg=${FG}"
set -g menu-selected-style "bg=${C_ACCENT},fg=${DARK},bold"
set -g menu-border-style   "fg=${C_ACCENT}"
set -g menu-border-lines   rounded
