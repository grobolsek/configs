# Prefix and no-prefix bindings carry a -N note so they show up in the
# `prefix ?` helper. Only bindings that differ from tmux's defaults are here;
# defaults like `z` zoom, `d` detach, or `x` / `&` kill (they ask first) are
# left alone. Shortcuts like split-right are defined in ui.conf.

# ─── Panes + windows ─────────────────────────────────────────────────────────
unbind '"'
unbind %
bind -N "Split right"     | split-right
bind -N "Split down"      - split-down
bind -N "New window"      c new-window-here
bind -N "Last window"     Tab last-window
bind -N "Reload config"   R source-file ~/.config/tmux/tmux.conf \; display "config reloaded"
bind -N "Clear screen"    C-l send-keys C-l   # plain C-l belongs to vim-tmux-navigator

# ─── Popups ──────────────────────────────────────────────────────────────────
bind -N "Lazygit"                       g tool -T "${T}Lazygit " lazygit
bind -N "Scratch shell"                 t tool -T "${T}Shell "
bind -N "Search keybinds (Enter runs)"  ? helper -T "${T}Keys " "$SCRIPTS/keys.sh"
bind -N "Command palette"               : helper -T "${T}Command " "$SCRIPTS/cmd.sh"
bind -N "Sessions: switch/kill/rename/move" w helper -w 90% -h 90% -T "${T}Sessions " "$SCRIPTS/jump.sh"

# ─── Prompts ─────────────────────────────────────────────────────────────────
# Every prompt and message lands on row 2 by itself (theme.conf), so prompts
# need nothing special. The renames replace tmux's defaults only to use %1
# instead of %%, which breaks names that contain a '.
bind -N "Plain command prompt" e command-prompt -p ""
bind -N "Rename window"        , rename-window-prompt
bind -N "Rename session"     '$' rename-session-prompt
bind -N "Pane title"           T command-prompt -p "pane title:" -I "#T" { select-pane -T %1 }

# ─── No-prefix shortcuts ─────────────────────────────────────────────────────
bind -N "Window 1" -n M-1 select-window -t 1
bind -N "Window 2" -n M-2 select-window -t 2
bind -N "Window 3" -n M-3 select-window -t 3
bind -N "Window 4" -n M-4 select-window -t 4
bind -N "Window 5" -n M-5 select-window -t 5
bind -N "Window 6" -n M-6 select-window -t 6
bind -N "Window 7" -n M-7 select-window -t 7
bind -N "Window 8" -n M-8 select-window -t 8
bind -N "Window 9" -n M-9 select-window -t 9
bind -N "Zoom pane" -n M-z resize-pane -Z

# ─── Copy mode (vim-like; copies straight to the clipboard) ──────────────────
# tmux's defaults already copy on mouse drag, double click (word) and triple
# click (line), and C-v toggles block selection.
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel

# ─── Resize mode: prefix r, then h/j/k/l (HJKL = bigger), Esc/q/Enter to leave
bind -N "Resize mode" r switch-client -T resize \; refresh-client -S

bind -T resize h     resize-pane -L 2  \; switch-client -T resize
bind -T resize j     resize-pane -D 2  \; switch-client -T resize
bind -T resize k     resize-pane -U 2  \; switch-client -T resize
bind -T resize l     resize-pane -R 2  \; switch-client -T resize
bind -T resize Left  resize-pane -L 2  \; switch-client -T resize
bind -T resize Down  resize-pane -D 2  \; switch-client -T resize
bind -T resize Up    resize-pane -U 2  \; switch-client -T resize
bind -T resize Right resize-pane -R 2  \; switch-client -T resize
bind -T resize H     resize-pane -L 10 \; switch-client -T resize
bind -T resize J     resize-pane -D 10 \; switch-client -T resize
bind -T resize K     resize-pane -U 10 \; switch-client -T resize
bind -T resize L     resize-pane -R 10 \; switch-client -T resize
bind -T resize =     select-layout -E  \; switch-client -T resize
bind -T resize z     resize-pane -Z    \; switch-client -T resize
bind -T resize Escape switch-client -T root \; refresh-client -S
bind -T resize q      switch-client -T root \; refresh-client -S
bind -T resize Enter  switch-client -T root \; refresh-client -S
# any other key also leaves, and refreshes so the RESIZE label goes away at once
bind -T resize Any    switch-client -T root \; refresh-client -S
