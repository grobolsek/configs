# ~/.config/tmux/tmux.conf
# Bar colors are defined once in the Look section.

# ─── Prefix: Ctrl+Space ──────────────────────────────────────────────────────
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# ─── General ─────────────────────────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"
set -g mouse on
set -g escape-time 10
set -g focus-events on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g set-titles on
set -g allow-passthrough on
set -s extended-keys on
set -g display-time 1500
setw -g mode-keys vi

# ─── Clipboard: auto-copy on mouse select (Wayland) ──────────────────────────
set -s set-clipboard on
set -s copy-command "wl-copy"

bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel
bind -T copy-mode    MouseDragEnd1Pane send -X copy-pipe-and-cancel

bind -n DoubleClick1Pane if -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" \
  "send -M" \
  "select-pane -t= ; copy-mode -M ; send -X select-word ; run -d0.2 ; send -X copy-pipe-and-cancel"
bind -n TripleClick1Pane if -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" \
  "send -M" \
  "select-pane -t= ; copy-mode -M ; send -X select-line ; run -d0.2 ; send -X copy-pipe-and-cancel"

bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-pipe-and-cancel

# ─── Keybinds (all show up in `prefix ?`) ────────────────────────────────────
unbind '"'
unbind %
bind -N "Split right"     | split-window -h -c "#{pane_current_path}"
bind -N "Split down"      - split-window -v -c "#{pane_current_path}"
bind -N "New window"      c new-window -c "#{pane_current_path}"
bind -N "Last window"     Tab last-window
bind -N "Kill pane"       x kill-pane
bind -N "Zoom pane"       z resize-pane -Z
bind -n M-z resize-pane -Z                       # Alt+z zoom, no prefix
bind -N "Reload config"   R source-file ~/.config/tmux/tmux.conf \; display "config reloaded"
bind -N "Clear screen"    C-l send-keys C-l

bind -N "Lazygit popup"   g display-popup -E -w 90% -h 90% -d "#{pane_current_path}" lazygit
bind -N "Scratch shell"   t display-popup -E -w 80% -h 80% -d "#{pane_current_path}"

bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# ─── Resize mode (herdr-style): prefix r, then h/j/k/l, Esc to leave ─────────
bind -N "Resize mode" r switch-client -T resize \; refresh-client -S

bind -T resize h     resize-pane -L 2  \; switch-client -T resize
bind -T resize j     resize-pane -D 2  \; switch-client -T resize
bind -T resize k     resize-pane -U 2  \; switch-client -T resize
bind -T resize l     resize-pane -R 2  \; switch-client -T resize
bind -T resize Left  resize-pane -L 2  \; switch-client -T resize
bind -T resize Down  resize-pane -D 2  \; switch-client -T resize
bind -T resize Up    resize-pane -U 2  \; switch-client -T resize
bind -T resize Right resize-pane -R 2  \; switch-client -T resize
bind -T resize H     resize-pane -L 10 \; switch-client -T resize
bind -T resize J     resize-pane -D 10 \; switch-client -T resize
bind -T resize K     resize-pane -U 10 \; switch-client -T resize
bind -T resize L     resize-pane -R 10 \; switch-client -T resize
bind -T resize =     select-layout -E  \; switch-client -T resize
bind -T resize z     resize-pane -Z    \; switch-client -T resize
bind -T resize Escape switch-client -T root \; refresh-client -S
bind -T resize q      switch-client -T root \; refresh-client -S
bind -T resize Enter  switch-client -T root \; refresh-client -S

# ─── Which-key style menu: prefix Space ──────────────────────────────────────
bind -N "Keybind menu" Space display-menu -T "#[align=centre,bold] Keys " -x C -y C -- \
  "-#[fg=brightblack]── Panes ──"    "" "" \
  "Split right"         "|" "split-window -h -c '#{pane_current_path}'" \
  "Split down"          "-" "split-window -v -c '#{pane_current_path}'" \
  "Zoom toggle"         "z" "resize-pane -Z" \
  "Resize mode"         "r" "switch-client -T resize ; refresh-client -S" \
  "Kill pane"           "x" "kill-pane" \
  "Swap with next"      ">" "swap-pane -D" \
  "Break to window"     "!" "break-pane" \
  "" \
  "-#[fg=brightblack]── Windows ──"  "" "" \
  "New window"          "c" "new-window -c '#{pane_current_path}'" \
  "Rename window"       "," "command-prompt -I '#W' { rename-window -- '%%' }" \
  "Kill window"         "&" "kill-window" \
  "" \
  "-#[fg=brightblack]── Sessions ──" "" "" \
  "Pick session/window" "w" "choose-tree -Zs" \
  "New session"         "N" "new-session" \
  "Rename session"      "$" "command-prompt -I '#S' { rename-session -- '%%' }" \
  "Detach"              "d" "detach-client" \
  "" \
  "-#[fg=brightblack]── Tools ──"    "" "" \
  "Lazygit"             "g" "display-popup -E -w 90% -h 90% -d '#{pane_current_path}' lazygit" \
  "Scratch shell"       "t" "display-popup -E -w 80% -h 80% -d '#{pane_current_path}'" \
  "Copy mode"           "[" "copy-mode" \
  "Reload config"       "R" "source-file ~/.config/tmux/tmux.conf ; display 'config reloaded'" \
  "Browse ALL keys"     "?" "customize-mode -Z"

# ─── Look: NvChad-style statusline on top ───────────────────────────────────
# Colors come from Noctalia: it renders ~/.config/tmux/colors.conf from a
# template on every theme change and reloads tmux. Values here are fallbacks.
set -g @bar "#241a19"
set -g @seg "#423a39"
set -g @seg2 "#302626"
set -g @fg "#e6d6d3"
set -g @dim "#8a7a78"
set -g @dark "#1b1211"
set -g @c_normal "#d6ba86"
set -g @c_prefix "#f2aaa4"
set -g @c_resize "#c9a2c4"
set -g @c_copy "#a3c2a0"
set -g @c_accent "#f2aaa4"
source-file -q ~/.config/tmux/colors.conf

%hidden BAR="#{@bar}"
%hidden SEG="#{@seg}"
%hidden SEG2="#{@seg2}"
%hidden FG="#{@fg}"
%hidden DIM="#{@dim}"
%hidden DARK="#{@dark}"
%hidden C_NORMAL="#{@c_normal}"
%hidden C_PREFIX="#{@c_prefix}"
%hidden C_RESIZE="#{@c_resize}"
%hidden C_COPY="#{@c_copy}"
%hidden C_ACCENT="#{@c_accent}"

%hidden IS_RESIZE="#{==:#{client_key_table},resize}"
%hidden ACTIVE="#{||:#{client_prefix},#{pane_in_mode}}"
%hidden MODE_COLOR="#{?${IS_RESIZE},${C_RESIZE},#{?client_prefix,${C_PREFIX},#{?pane_in_mode,${C_COPY},${C_NORMAL}}}}"
%hidden MODE_NAME="#{?${IS_RESIZE},RESIZE,#{?client_prefix,PREFIX,#{?pane_in_mode,COPY,NORMAL}}}"
%hidden Z="#{?window_zoomed_flag, Z,}"

# Key hints (shown in place of the tabs while a mode is active, herdr-style)
%hidden K="#[fg=${C_ACCENT}]"
%hidden D="#[fg=${DIM}]"
%hidden H_PREFIX="  ${K}|${D} split→  ${K}-${D} split↓  ${K}c${D} window  ${K}x${D} kill  ${K}z${D} zoom  ${K}r${D} resize  ${K}w${D} sessions  ${K}g${D} lazygit  ${K}t${D} shell  ${K}[${D} copy  ${K}R${D} reload  ${K}Space${D} menu  ${K}?${D} all"
%hidden H_RESIZE="  ${K}hjkl${D} resize  ${K}HJKL${D} ×5  ${K}=${D} equalize  ${K}z${D} zoom  ${K}Esc${D} done"
%hidden H_COPY="  ${K}v${D} select  ${K}C-v${D} block  ${K}y${D} copy  ${K}/${D} search  ${K}q${D} quit"

set -g status on
set -g status-position top
set -g status-interval 5
set -g status-justify left
set -g status-style "bg=${BAR},fg=${FG}"

# Left: mode block  ▸ session block  ▸ (hints when a mode is active)
set -g status-left-length 220
set -g status-left "#[fg=${DARK}]#[bg=${MODE_COLOR}]#[bold]  ${MODE_NAME} #[fg=${MODE_COLOR}]#[bg=${SEG}]#[nobold]#[fg=${FG}]  #S #[fg=${SEG}]#[bg=${BAR}]#{?${ACTIVE},#{?${IS_RESIZE},${H_RESIZE},#{?client_prefix,${H_PREFIX},${H_COPY}}},} "

# Tabs: current one gets a slanted block, others dim. Hidden while hints show.
set -g window-status-separator ""
setw -g window-status-format         "#{?${ACTIVE},,#[fg=${DIM}] #I #W${Z} }"
setw -g window-status-current-format "#{?${ACTIVE},,#[fg=${BAR}]#[bg=${SEG2}]#[fg=${FG}]#[bold] #I #W${Z} #[fg=${SEG2}]#[bg=${BAR}]#[nobold]}"

# Right: icon pills like NvChad (directory, clock)
set -g status-right-length 80
set -g status-right "#[fg=${C_ACCENT},bg=${BAR}]#[fg=${DARK},bg=${C_ACCENT}] #[fg=${FG},bg=${SEG2}] #{b:pane_current_path} #[fg=${C_ACCENT},bg=${SEG2}]#[fg=${DARK},bg=${C_ACCENT}] #[fg=${FG},bg=${SEG2}] %H:%M "

set -g pane-border-style        "fg=${SEG}"
set -g pane-active-border-style "fg=${C_ACCENT}"
set -g pane-border-lines single

set -g message-style         "bg=${BAR},fg=${C_NORMAL},bold"
set -g message-command-style "bg=${BAR},fg=${C_NORMAL}"
setw -g mode-style           "bg=${C_ACCENT},fg=${DARK}"

set -g popup-border-style  "fg=${C_ACCENT}"
set -g popup-border-lines  rounded
set -g menu-style          "bg=${BAR},fg=${FG}"
set -g menu-selected-style "bg=${C_ACCENT},fg=${DARK},bold"
set -g menu-border-style   "fg=${C_ACCENT}"
set -g menu-border-lines   rounded

# ─── Plugins ─────────────────────────────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'

run '~/.config/tmux/plugins/tpm/tpm'
