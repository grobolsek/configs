# ~/.config/tmux/tmux.conf: entry point, only sources the parts in order.
# See README.md for how it all fits together and which keys to use.
#
#   conf/options.conf   prefix, general settings, clipboard
#   conf/theme.conf     colors, status bar (row 1), message row (row 2), popups
#   conf/ui.conf        command shortcuts used by keys + menu (helper, split-right, …)
#   conf/keys.conf      every keybinding (popups, prompts, copy + resize mode)
#   conf/menu.conf      the prefix Space menu
#   conf/plugins.conf   plugins; TPM must load last
#
# The order matters: ui.conf must run before keys.conf and menu.conf use its
# shortcuts. fzf helper popups live in scripts/ and share scripts/lib/ui.sh;
# scripts/line2.sh shows/hides row 2. colors.conf is generated by Noctalia.

source-file ~/.config/tmux/conf/options.conf
source-file ~/.config/tmux/conf/theme.conf
source-file ~/.config/tmux/conf/ui.conf
source-file ~/.config/tmux/conf/keys.conf
source-file ~/.config/tmux/conf/menu.conf
source-file ~/.config/tmux/conf/plugins.conf
